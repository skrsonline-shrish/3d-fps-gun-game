<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arena Strike 3D</title>
    <meta
      name="description"
      content="A lightweight 3D arena shooter inspired by fast-action arcade gunfights."
    />
  </head>
  <body>
    <div id="hud">
      <div class="stats">
        <span>Health: <strong id="health">100</strong></span>
        <span>Ammo: <strong id="ammo">18 / 90</strong></span>
        <span>Score: <strong id="score">0</strong></span>
      </div>
      <div id="statusText">Click to lock cursor and start</div>
    </div>

    <div id="gameOver" class="hidden">
      <div class="panel">
        <h1>Match Over</h1>
        <p id="finalScore">Score: 0</p>
        <button id="restartBtn">Play Again</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
